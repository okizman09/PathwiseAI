services:
  - type: web
    name: pathwise-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: APP_SIGNING_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WORKFLOWS_PER_DAY
        value: "2"
      - key: INTERVIEW_TURNS_PER_DAY
        value: "25"
      - key: STEP_ACTIONS_PER_DAY
        value: "20"
      - key: RUN_STEPS_PER_DAY
        value: "10"
      - key: GLOBAL_STEP_RUNS_PER_DAY
        value: "200"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: tool-assets
      - key: CRON_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BETA_ALLOWLIST_ENABLED
        value: "false"
      - key: BETA_ALLOWED_EMAILS
        sync: false
